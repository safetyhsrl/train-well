<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Well</title>
  <meta name="theme-color" content="#01452a">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261020d">
</head>
<body>
  <div class="shell hidden" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="logo-mark"><img src="img/logo.png" alt=""></span> Train Well</div>
      <nav class="nav" id="nav">
        <a href="#my" class="employee-only hidden">My training</a>
        <a href="#learn" class="employee-only hidden">My courses</a>
        <a href="#certs" class="employee-only hidden">My certificates</a>
        <a href="#mysessions" class="employee-only hidden">My sessions</a>
        <a href="#mydrills" class="employee-only hidden">My fire drills</a>
        <a href="#dashboard" class="staff-only">Dashboard</a>
        <a href="#employees" class="staff-only">Employees</a>
        <a href="#records" class="staff-only">Training records</a>
        <a href="#sessions" class="staff-only">Sessions &amp; attendance</a>
        <a href="#drills" class="staff-only">Fire Drill</a>
        <a href="#courses" class="staff-only">Courses</a>
        <div class="section admin-only">Administration</div>
        <a href="#users" class="admin-only">Users</a>
        <a href="#facilities" class="admin-only">Facilities</a>
      </nav>
      <div class="me">
        <strong id="meName"></strong>
        <span id="meRole" class="muted" style="color:#a9c5c1"></span>
        <button id="logoutBtn" type="button">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div style="display:flex;gap:.6rem;align-items:center">
          <button class="secondary menu-toggle" id="menuBtn" type="button">☰</button>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div id="pageActions" class="toolbar" style="margin:0"></div>
          <div class="bell-wrap">
            <button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="bellPanel">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7Z"/></svg>
              <span class="bell-count hidden" id="bellCount"></span>
            </button>
            <div class="bell-panel hidden" id="bellPanel" role="dialog" aria-label="Notifications"></div>
          </div>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261020d"></script>
  <script src="js/client.js?v=20261020d"></script>
  <script src="js/app.js?v=20261020d"></script>
</body>
</html>
